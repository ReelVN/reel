name: Desktop release

on:
  push:
    tags: ['v[0-9]*']

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: reel-x86_64-pc-windows-msvc.zip
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: reel-x86_64-unknown-linux-gnu.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: reel-aarch64-apple-darwin.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: reel-x86_64-apple-darwin.tar.gz
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RUST_TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify engine version and runner architecture
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = rustc -vV
          $toolchain | Write-Output
          if ($toolchain -notcontains "host: $env:RUST_TARGET") {
            throw "This job needs a native $env:RUST_TARGET Rust toolchain."
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $cli = $metadata.packages | Where-Object name -eq 'reel-cli'
          if ($env:RELEASE_TAG -cne "v$($cli.version)") {
            throw "Tag $env:RELEASE_TAG does not match engine version $($cli.version)."
          }

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Build the desktop tools
        run: cargo build --locked --release -p reel-cli --features window --target $env:RUST_TARGET --target-dir target/desktop-build

      - name: Smoke-test and package the desktop tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $binaries = "target/desktop-build/$env:RUST_TARGET/release"
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $reel = (Resolve-Path -LiteralPath (Join-Path $binaries "reel$suffix")).Path
          & $reel --version
          & (Join-Path $binaries "reel-lsp$suffix") --version

          Push-Location examples/function_values
          try {
            & $reel check
          } finally {
            Pop-Location
          }

          ./.github/scripts/package-desktop.ps1 -BinaryDirectory $binaries -Archive "target/desktop-release/$env:ARCHIVE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: target/desktop-release/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-release

      - name: Publish archives and checksums
        working-directory: desktop-release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archives=(
            reel-x86_64-pc-windows-msvc.zip
            reel-x86_64-unknown-linux-gnu.tar.gz
            reel-aarch64-apple-darwin.tar.gz
            reel-x86_64-apple-darwin.tar.gz
          )
          sha256sum "${archives[@]}" > reel-checksums.txt
          options=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${archives[@]}" reel-checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Reel $RELEASE_TAG" "${options[@]}"
