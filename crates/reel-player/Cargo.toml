[package]
name = "reel-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
performance = ["profiling", "vm-execution-counts", "vm-profiling", "thread-profiling"]
profiling = ["reel-core/profiling", "reel-render/profiling", "reel-media/profiling"]
vm-profiling = ["profiling", "aside-vm/profiling"]
# Paired calling-thread execution/wall observations through the platform adapter.
thread-profiling = ["profiling"]
# Integer VM work deltas at presentation boundaries; independent of VM clocks.
vm-execution-counts = ["profiling", "aside-vm/execution-counts"]
winit = ["dep:winit", "dep:ui-events-winit", "dep:arboard"]
gamepad = ["dep:gilrs"]
video = ["reel-media/video"]
video-software = ["video", "reel-media/video-software"]
vita = ["video", "reel-media/opus", "reel-media/vita", "reel-media/vita-output", "reel-render/gxm"]
audio-output = ["reel-media/cpal-output"]
window = ["video-software", "audio-output", "gamepad", "winit", "dep:wgpu", "dep:pollster", "reel-render/wgpu"]

[dependencies]
smallvec.workspace = true
hashbrown.workspace = true
lru = "=0.19.0"
aside-vm = { path = "../aside-vm" }
reel-package = { path = "../reel-package" }
reel-storage = { path = "../reel-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
flate2 = "=1.1.10"
self_cell = "=1.3.0"
reel-media = { path = "../reel-media", default-features = false }
reel-ui.workspace = true
reel-engine = { path = "../reel-engine" }
blake3 = { version = "=1.8.7" }
image = { workspace = true, features = ["png", "jpeg", "webp", "qoi"] }
png = "=0.18.1"
qoi = "=0.4.1"
reel-core = { path = "../reel-core" }
reel-render = { path = "../reel-render" }
winit = { version = "=0.30.13", optional = true }
ui-events-winit = { version = "=0.3.0", optional = true }
wgpu = { version = "=30.0.1", optional = true }
pollster = { version = "=1.0.1", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
png = { version = "=0.18.1", features = ["benchmarks"] }
gilrs = { version = "=0.11.2", optional = true }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(not(target_os = "vita"))'.dependencies]
reel-media = { path = "../reel-media", default-features = false, features = ["decode"] }

[target.'cfg(target_os = "vita")'.dependencies]
vita-native = { workspace = true, features = ["app", "process-allocator"] }

[dev-dependencies]
allocation-counter = "=0.8.1"
reel-core = { path = "../reel-core", features = ["test-support"] }
reel-render = { path = "../reel-render", features = ["wgpu"] }
wgpu = "=30.0.1"
pollster = "=1.0.1"

[build-dependencies]
cc = "=1.8.0"

[[bin]]
name = "reel-diagnostic"
path = "src/main.rs"
required-features = ["window"]

[lints]
workspace = true

[[bin]]
name = "reel-session-host"
path = "src/session_main.rs"
required-features = ["window"]

[[bin]]
name = "reel-vita"
path = "src/vita_main.rs"
required-features = ["vita"]

[package.metadata.vita]
title_id = "REELVITAP"
title_name = "Reel"
assets = "runtime/vita"
build_std = "std,panic_unwind"
vita_make_fself_flags = ["-a", "0x2F00000000000001"]
vita_mksfoex_flags = ["-d", "ATTRIBUTE2=12", "-s", "APP_VER=00.42", "-s", "VERSION=00.42"]

[package.metadata.vita.profile.release]
strip_symbols = false
