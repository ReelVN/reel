[package]
name = "reel-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
winit = ["dep:winit", "dep:ui-events-winit"]
window = ["winit", "dep:wgpu", "dep:pollster", "reel-render/wgpu"]

[dependencies]
reel-ui.workspace = true
reel-engine = { path = "../reel-engine" }
blake3 = { version = "=1.8.2" }
image = { workspace = true, features = ["png", "jpeg"] }
reel-core = { path = "../reel-core" }
reel-render = { path = "../reel-render" }
winit = { version = "=0.30.12", optional = true }
ui-events-winit = { version = "=0.3.0", optional = true }
wgpu = { version = "=26.0.1", optional = true }
pollster = { version = "=0.4.0", optional = true }

[dev-dependencies]
aside-vm = { path = "../aside-vm" }

[[bin]]
name = "reel-diagnostic"
path = "src/main.rs"
required-features = ["window"]

[lints]
workspace = true

[[bin]]
name = "reel-session-host"
path = "src/session_main.rs"
required-features = ["window"]
