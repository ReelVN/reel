[package]
name = "reel-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
window = ["dep:winit", "dep:wgpu", "dep:pollster", "reel-render/wgpu"]

[dependencies]
masonry = { path = "../../third_party/masonry/masonry", default-features = false }
reel-core = { path = "../reel-core" }
reel-stage = { path = "../reel-stage" }
reel-render = { path = "../reel-render" }
masonry_core = { path = "../../third_party/masonry/masonry_core", default-features = false }
winit = { version = "=0.30.12", optional = true }
wgpu = { version = "=26.0.1", optional = true }
pollster = { version = "=0.4.0", optional = true }

[[bin]]
name = "reel-diagnostic"
path = "src/main.rs"
required-features = ["window"]

[lints]
workspace = true
