[package]
name = "aside-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Lossless Aside v1 source frontend"

[features]
# Explicit execution diagnostics for Rust workloads; disabled by default.
execution-counts = ["aside-vm/execution-counts"]
# Sampled VM operation attribution for the existing Rust workload harness.
profiling = ["aside-vm/profiling"]

[dependencies]
hashbrown.workspace = true
blake3 = "=1.8.7"
line-index = "=0.1.2"
aside-vm = { path = "../aside-vm" }
logos = "=0.16.1"
aside-syntax = { path = "../aside-syntax" }
smallvec = "=1.16.3"
unicode-ident = "=1.0.27"
codespan-reporting = "=0.13.1"

[dev-dependencies]
stats_alloc = "=0.1.10"
serde_json = "=1.0.154"

[target.'cfg(windows)'.dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
