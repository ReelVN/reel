[package]
name = "reel-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
wgpu = ["dep:wgpu", "dep:lyon_tessellation", "dep:swash", "dep:bytemuck", "dep:pollster", "dep:half", "dep:masonry_core"]

[dependencies]
reel-core = { path = "../reel-core" }
reel-stage = { path = "../reel-stage" }

wgpu = { version = "=26.0.1", optional = true }
lyon_tessellation = { version = "=1.0.22", optional = true }
swash = { version = "=0.2.10", optional = true }
bytemuck = { version = "=1.25.2", features = ["derive"], optional = true }
pollster = { version = "=0.4.0", optional = true }
half = { version = "=2.7.1", optional = true }
masonry_core = { path = "../../third_party/masonry/masonry_core", default-features = false, optional = true }

[dev-dependencies]
masonry_core = { path = "../../third_party/masonry/masonry_core", default-features = false }
masonry = { path = "../../third_party/masonry/masonry", default-features = false }

[lints]
workspace = true
