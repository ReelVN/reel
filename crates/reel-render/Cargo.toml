[package]
name = "reel-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
profiling = ["reel-core/profiling"]
wgpu = ["dep:wgpu", "dep:lyon_tessellation", "dep:swash", "dep:bytemuck", "dep:pollster", "dep:half", "dep:guillotiere"]
gles2 = ["dep:pvr-psp2-sys", "dep:pvr-compiler", "dep:lyon_tessellation", "dep:swash", "dep:bytemuck", "dep:half", "dep:guillotiere"]

[dependencies]
reel-ui.workspace = true
smallvec.workspace = true
reel-core = { path = "../reel-core" }

wgpu = { version = "=30.0.1", optional = true }
lyon_tessellation = { version = "=1.0.22", optional = true }
swash = { version = "=0.2.10", optional = true }
bytemuck = { version = "=1.25.2", features = ["derive"], optional = true }
pollster = { version = "=1.0.1", optional = true }
half = { version = "=2.7.1", optional = true }
guillotiere = { version = "=0.7.0", optional = true }

pvr-psp2-sys = { workspace = true, optional = true, features = ["graphics"] }

[build-dependencies]
pvr-compiler = { git = "https://github.com/jhq223/pvr-compiler.git", rev = "21f382885f7250149ff9fde4d21ad17769cda325", optional = true }

[lints]
workspace = true

[dev-dependencies]
stats_alloc = "=0.1.10"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
