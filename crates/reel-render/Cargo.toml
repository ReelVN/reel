[package]
name = "reel-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
profiling = ["reel-core/profiling", "vita-native?/profiling"]
wgpu = ["dep:wgpu", "dep:lyon_tessellation", "dep:swash", "dep:bytemuck", "dep:pollster", "dep:half", "dep:guillotiere"]
gxm = ["dep:vita-native", "vita-native/graphics", "vita-native/video", "dep:lyon_tessellation", "dep:swash", "dep:bytemuck", "dep:half", "dep:guillotiere"]

[dependencies]
reel-ui.workspace = true
smallvec.workspace = true
reel-core = { path = "../reel-core" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }

wgpu = { version = "=30.0.1", optional = true }
lyon_tessellation = { version = "=1.0.22", optional = true }
swash = { version = "=0.2.10", optional = true }
bytemuck = { version = "=1.25.2", features = ["derive", "extern_crate_alloc"], optional = true }
pollster = { version = "=1.0.1", optional = true }
half = { version = "=2.7.1", optional = true }
guillotiere = { version = "=0.7.0", optional = true }

vita-native = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
stats_alloc = "=0.1.10"
