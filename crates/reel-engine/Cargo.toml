[package]
name = "reel-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
arrayvec = { version = "=0.7.8", default-features = false }
smallvec.workspace = true
self_cell = "=1.3.0"
aside-host = { path = "../aside-host" }
aside-std = { path = "../aside-std" }
aside-vm = { path = "../aside-vm" }
aside-compiler = { path = "../aside-compiler" }
reel-core = { path = "../reel-core" }
reel-ui = { path = "../reel-ui" }
unicode-segmentation = "=1.13.3"
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
blake3 = "=1.8.7"
hashbrown.workspace = true
unic-langid = "=0.9.6"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints]
workspace = true
