[package]
name = "reel-dev"
default-run = "reel-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
vita-probe = ["dep:reel-core", "dep:reel-ui", "dep:reel-render", "dep:reel-player", "dep:reel-storage", "dep:pvr-psp2-sys"]

[dependencies]
anyhow = "=1.0.104"
reel-package = { path = "../reel-package" }
serde_json = "=1.0.154"
reel-storage = { path = "../reel-storage", optional = true }
reel-core = { path = "../reel-core", features = ["profiling"], optional = true }
reel-ui = { workspace = true, optional = true }
reel-render = { path = "../reel-render", features = ["profiling"], optional = true }
reel-player = { path = "../reel-player", features = ["profiling"], optional = true }
pvr-psp2-sys = { workspace = true, features = ["platform"], optional = true }

[target.'cfg(target_os = "vita")'.dependencies]
reel-render = { path = "../reel-render", features = ["gxm"], optional = true }
pvr-psp2-sys = { workspace = true, features = ["gxm"], optional = true }
reel-player = { path = "../reel-player", features = ["vita", "profiling"], optional = true }

[build-dependencies]
reel-ui = { workspace = true, optional = true }
reel-render = { path = "../reel-render", default-features = false, optional = true }

[[bin]]
name = "reel-gpu-probe"
path = "src/probe/main.rs"
required-features = ["vita-probe"]

[package.metadata.vita]
title_id = "REELP0002"
title_name = "Reel GPU Probe"
assets = "runtime/vita"
build_std = "std,panic_unwind"
vita_make_fself_flags = ["-a", "0x2F00000000000001"]
vita_mksfoex_flags = ["-d", "ATTRIBUTE2=12", "-s", "APP_VER=01.00", "-s", "VERSION=01.00"]

[package.metadata.vita.profile.release]
strip_symbols = false

[lints]
workspace = true
