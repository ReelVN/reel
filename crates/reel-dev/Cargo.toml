[package]
name = "reel-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "=1.0.104"
aside-vm = { path = "../aside-vm" }
fastrand = "=2.5.0"
pollster = "=1.0.1"
reel-core = { path = "../reel-core" }
reel-engine = { path = "../reel-engine" }
reel-media = { path = "../reel-media", default-features = false }
reel-player = { path = "../reel-player", default-features = false, features = ["video"] }
reel-render = { path = "../reel-render", features = ["wgpu"] }
reel-ui.workspace = true
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
wgpu = "=30.0.1"

[lints]
workspace = true
