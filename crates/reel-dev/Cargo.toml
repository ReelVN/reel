[package]
name = "reel-dev"
default-run = "reel-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
device-checks = ["dep:reel-core", "dep:reel-ui", "dep:reel-render", "dep:vita-native"]

[dependencies]
anyhow = "=1.0.104"
walkdir = "=2.5.0"
clap = { version = "=4.6.7", features = ["derive"] }
reel-package = { path = "../reel-package" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reel-core = { path = "../reel-core", features = ["profiling"], optional = true }
reel-ui = { workspace = true, optional = true }
reel-render = { path = "../reel-render", features = ["profiling"], optional = true }
reel-player = { path = "../reel-player", features = ["performance"] }
vita-native = { workspace = true, features = ["app"], optional = true }

[target.'cfg(target_os = "vita")'.dependencies]
reel-render = { path = "../reel-render", features = ["gxm"], optional = true }
vita-native = { workspace = true, features = ["graphics"], optional = true }
reel-player = { path = "../reel-player", features = ["vita"] }

[build-dependencies]
reel-ui = { workspace = true, optional = true }
reel-render = { path = "../reel-render", default-features = false, optional = true }

[[bin]]
name = "reel-device-checks"
path = "src/device_checks/main.rs"
required-features = ["device-checks"]

[package.metadata.vita]
title_id = "REELP0002"
title_name = "Reel Device Checks"
assets = "runtime/vita/device-checks"
build_std = "std,panic_unwind"
vita_make_fself_flags = ["-a", "0x2F00000000000001"]
vita_mksfoex_flags = ["-d", "ATTRIBUTE2=12", "-s", "APP_VER=01.00", "-s", "VERSION=01.00"]

[package.metadata.vita.profile.release]
strip_symbols = false

[lints]
workspace = true
