[package]
name = "reel-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository = "https://github.com/jhq223/reel"
description = "Reel UI runtime, widgets, presentation bridge and portable frames"

[features]
default = []
tracy = ["dep:tracing-tracy", "tracing-tracy/enable"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
accesskit.workspace = true
anymap3 = "=1.1.0"
anymore.workspace = true
cursor-icon = "=1.2.0"
dpi.workspace = true
imaging.workspace = true
unicode-segmentation = "=1.13.3"
kurbo.workspace = true
peniko = { workspace = true, features = ["serde"] }
smallvec.workspace = true
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "grid", "content_size"] }
skrifa = "=0.48.0"
tracing = { workspace = true, features = ["default"] }
tracing-core = { version = "=0.1.36", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "time"] }
tracing-tracy = { version = "=0.12.0", features = ["manual-lifetime"], optional = true }
hashbrown.workspace = true
reel-core = { path = "../reel-core" }
ui-events.workspace = true

[target.'cfg(not(target_os = "vita"))'.dependencies]
reel-text = { workspace = true, features = ["system"] }

[target.'cfg(target_os = "vita")'.dependencies]
reel-text = { workspace = true, features = ["libm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
time = { workspace = true, features = ["macros", "formatting"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
tracing-wasm.workspace = true
web-time.workspace = true

[dev-dependencies]
imaging_vello_cpu = "=0.0.2"
stats_alloc = "=0.1.10"
[target.'cfg(target_os = "android")'.dependencies]
tracing_android_trace = "=0.1.1"

[lints]
workspace = true
