[package]
name = "reel-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["cpal-output"]
cpal-output = ["dep:cpal"]

[dependencies]
reel-core = { path = "../reel-core" }
reel-audio = { path = "../reel-audio", default-features = false }
rtrb = "=0.4.0"
triple_buffer = "=9.0.0"
atomic_refcell = "=0.1.13"
sync_wrapper = "=1.0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
cpal = { version = "=0.18.1", default-features = false, features = ["realtime"], optional = true }

[lints]
workspace = true
