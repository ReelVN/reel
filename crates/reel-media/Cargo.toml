[package]
name = "reel-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["cpal-output"]
cpal-output = ["dep:cpal"]
opus = ["dep:opus", "dep:symphonia", "reel-audio/ogg"]
decode = ["reel-audio/wav", "reel-audio/pcm", "reel-audio/ogg", "reel-audio/vorbis", "reel-audio/flac", "reel-audio/mp3", "opus"]
encode = ["decode", "dep:ogg", "dep:rubato"]
video = []
video-software = ["video", "dep:openh264", "dep:symphonia", "symphonia/aac", "dep:mp4", "dep:h264-reader"]

[dependencies]
reel-core = { path = "../reel-core" }
reel-audio = { path = "../reel-audio", default-features = false }
rtrb = "=0.4.0"
triple_buffer = "=9.0.0"
atomic_refcell = "=0.1.14"
sync_wrapper = "=1.0.2"
openh264 = { version = "=0.9.9", optional = true }
symphonia = { version = "=0.6.1", default-features = false, optional = true }
h264-reader = { version = "=0.9.0", optional = true }
mp4 = { version = "=0.14.0", optional = true }
opus = { version = "=0.4.0", optional = true }
ogg = { version = "=0.9.2", optional = true }
rubato = { version = "=5.0.1", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["realtime"], optional = true }

[lints]
workspace = true
