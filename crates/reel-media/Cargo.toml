[package]
name = "reel-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["cpal-output"]
cpal-output = ["dep:cpal"]
decode = ["reel-audio/wav", "reel-audio/pcm", "reel-audio/ogg", "reel-audio/vorbis", "reel-audio/flac", "reel-audio/mp3"]
video = ["dep:openh264", "dep:symphonia", "dep:mp4", "dep:h264-reader"]

[dependencies]
reel-core = { path = "../reel-core" }
reel-audio = { path = "../reel-audio", default-features = false }
rtrb = "=0.4.0"
triple_buffer = "=9.0.0"
atomic_refcell = "=0.1.14"
sync_wrapper = "=1.0.2"
openh264 = { version = "=0.9.9", optional = true }
symphonia = { version = "=0.6.1", default-features = false, features = ["aac"], optional = true }
h264-reader = { version = "=0.9.0", optional = true }
mp4 = { version = "=0.14.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["realtime"], optional = true }

[target.'cfg(target_os = "vita")'.dependencies]
vitasdk-sys = { version = "=0.3.3", features = ["SceAudiodec_stub"] }

[lints.rust]
# Native SDK calls are confined to private target modules; portable code denies unsafe.
unsafe_code = "deny"
