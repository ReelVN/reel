[package]
readme = "README.md"
name = "tree_arena"
version = "0.2.0"
description = "An arena allocated tree."
keywords = ["arena", "tree"]
categories = ["algorithms", "data-structures"]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"

[package.metadata.docs.rs]
all-features = true # all features are enabled - this means that the generated docs are for the safe version
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
default = ["std", "safe_tree"]
# Enable an independently leased preallocated lookup workspace. Without std,
# lookup uses bounded stack chunks, preserving correctness without allocation.
std = []
# This crate contains two implementations of a tree for use in masonry, one safe and the other unsafe.
# The safe tree is known to work, and serves as the baseline implementation and is used by default.
# The unsafe tree leverages a hashmap as an arena and is designed for higher performance: it leverages unsafe code to achieve this.
# The unsafe tree is not yet fully tested, and is not used by default.
safe_tree = []

[dependencies]
hashbrown.workspace = true

[dev-dependencies]
stats_alloc = "=0.1.10"

[[test]]
name = "lookup_depth"
required-features = ["std", "safe_tree"]

[lints]
# unsafe code is not allowed in Xilem or Masonry
# We would like to set this to `forbid`, but we have to use `deny` because `android_activity`
# requires us to use the `#[unsafe(no_mangle)]` attribute
# (And cargo doesn't let us have platform specific lints here)
rust.unsafe_code = "deny"

rust.unexpected_cfgs = { level = "warn", check-cfg = ['cfg(compile_stress_test)'] }

# LINEBENDER LINT SET - Cargo.toml - v8
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.cast_possible_wrap = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

# These two Cargo-wide lints inspect unrelated Reel members after integration.
# Keep Rust/API lints below intact without forcing metadata/feature API changes.
clippy.cargo_common_metadata = "allow"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "allow"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET
