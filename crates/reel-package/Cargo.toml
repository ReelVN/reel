[package]
name = "reel-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded ASB code-container codec and static metadata validation"

[dependencies]
aside-vm = { path = "../aside-vm" }
blake3 = "=1.8.7"
lz4_flex = { version = "=0.12.2", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unic-langid = "=0.9.6"

[lints]
workspace = true
