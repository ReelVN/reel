[package]
name = "reel-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0 OR MIT"
description = "Reel text shaping, line breaking, layout, and editing"
repository = "https://github.com/jhq223/reel"

[lib]
name = "reel_text"

[features]
default = ["system"]
accesskit = ["dep:accesskit"]
libm = ["fontique/libm", "skrifa/libm", "dep:core_maths"]
std = ["fontique/std", "harfrust/std", "skrifa/std", "parlance/std"]
system = ["std", "fontique/system"]

[dependencies]
accesskit = { version = "=0.25.1", optional = true }
core_maths = { version = "=0.1.1", optional = true }
fontique = { version = "=0.12.0", default-features = false }
harfrust = { version = "=0.14.0", default-features = false }
hashbrown = { version = "=0.17.1", default-features = false, features = ["default-hasher", "raw-entry"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data", "auto"] }
linebender_resource_handle = { version = "=0.1.1", default-features = false }
parlance = { version = "=0.1.1", default-features = false }
parley_data = { version = "=0.12.0", default-features = false, features = ["baked"] }
skrifa = { version = "=0.48.0", default-features = false }

[lints]
workspace = true
