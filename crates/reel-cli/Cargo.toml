[package]
name = "reel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Check, build and play Aside stories"
default-run = "reel"

[features]
default = []
window = ["reel-player/window"]
scenario-profile = ["reel-render/profiling"]

[[bin]]
name = "reel"
path = "src/main.rs"

[[bin]]
name = "reel-game"
path = "src/bin/reel-game.rs"
required-features = ["window"]

[[bin]]
name = "reel-lsp"
path = "src/bin/reel-lsp.rs"

[dependencies]
guillotiere = "=0.7.0"
walkdir = "=2.5.0"
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
aside-compiler = { path = "../aside-compiler" }
aside-host = { path = "../aside-host" }
aside-lsp = { path = "../aside-lsp" }
lsp-types = "=0.97.0"
aside-vm = { path = "../aside-vm" }
codespan-reporting = "=0.13.1"
serde_json = "=1.0.154"
toml = "=1.1.6"
globset = "=0.4.20"
reel-package = { path = "../reel-package" }
reel-engine = { path = "../reel-engine" }
reel-render = { path = "../reel-render" }
reel-ui = { path = "../reel-ui" }
reel-core = { path = "../reel-core" }
image = { workspace = true, features = ["png", "jpeg", "webp", "qoi"] }
rgbcx = { version = "=0.1.2", features = ["parallel"] }
reel-player = { path = "../reel-player" }
reel-storage = { path = "../reel-storage" }
reel-media = { path = "../reel-media", default-features = false, features = ["encode", "video-inspect"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[build-dependencies]
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.6"

[dev-dependencies]
lsp-server = "=0.7.9"
reel-media = { path = "../reel-media", default-features = false }
reel-core = { path = "../reel-core" }
reel-ui = { path = "../reel-ui" }
reel-render = { path = "../reel-render", features = ["wgpu"] }
wgpu = "=30.0.1"
pollster = "=1.0.1"

[lints]
workspace = true
