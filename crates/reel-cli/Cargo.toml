[package]
name = "reel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Check, build and play Aside stories"

[features]
default = []
window = ["dep:reel-player", "reel-player/window"]

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
aside-compiler = { path = "../aside-compiler" }
aside-vm = { path = "../aside-vm" }
codespan-reporting = "=0.13.1"
serde_json = "=1.0.154"
reel-package = { path = "../reel-package" }
reel-engine = { path = "../reel-engine" }
reel-core = { path = "../reel-core" }
image = { workspace = true, features = ["png", "jpeg"] }
reel-player = { path = "../reel-player", optional = true }
reel-storage = { path = "../reel-storage" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
reel-player = { path = "../reel-player" }
reel-core = { path = "../reel-core" }
reel-ui = { path = "../reel-ui" }

[lints]
workspace = true
