[package]
name = "aside-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Aside value storage and bounded incremental object tracing"

[features]
profiling = []
# Integer-only execution diagnostics, independently enabled from timed profiling.
execution-counts = []

[dependencies]
slotmap = "=1.1.1"
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
blake3 = "=1.8.7"
miniz_oxide = "=0.9.1"

[lints]
workspace = true

[dev-dependencies]
allocation-counter = "=0.8.1"
