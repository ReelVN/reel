[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
reel-ui = { path = "crates/reel-ui", default-features = false }
vita-native = { git = "https://github.com/jhq223/vita-native.git", rev = "81d614b699a105a30adfb02b464e14a02d5cc18f", default-features = false }

anymore = "=1.0.0"
imaging = "=0.0.1"
kurbo = "=0.13.1"
reel-text = { path = "crates/reel-text", default-features = false, features = ["accesskit"] }
peniko = "=0.6.1"
tracing = { version = "=0.1.44", default-features = false }
tracing-wasm = "=0.2.1"
console_error_panic_hook = "=0.1.7"
ui-events = { version = "=0.3.0", default-features = false, features = ["kurbo"] }
smallvec = "=1.16.3"
hashbrown = { version = "=0.17.1", default-features = false, features = ["default-hasher"] }
dpi = "=0.1.2"
image = { version = "=0.25.10", default-features = false }
web-time = "=1.1.0"
accesskit = "=0.25.1"
time = "=0.3.55"

[profile.build-perf]
inherits = "dev"

[profile.ci]
inherits = "dev"
debug = 0 # Don't compile debug info to reduce compilation artifact size for cache benefits.
[profile.ci.package."*"]
debug-assertions = true # Keep always on for dependencies for cache reuse.
